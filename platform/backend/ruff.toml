target-version = "py311"
line-length = 100

[lint]
# Arranque lenient para no romper CI con deuda histórica del repo:
# errores reales (E/F) sí bloquean, estilo (line-length, imports) no.
select = ["E", "F", "B"]
ignore = [
    "E501",  # line too long — lo cubre ruff format, no bloquear por esto
]

[format]
quote-style = "double"
