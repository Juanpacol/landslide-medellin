apiVersion: apps/v1
kind: Deployment
metadata:
  name: teyva-api
  namespace: teyva
  labels:
    app: teyva
    component: api
    version: "1.2.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: teyva
      component: api
  template:
    metadata:
      labels:
        app: teyva
        component: api
    spec:
      containers:
        - name: teyva-api
          image: teyva/api:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: teyva-secrets
                  key: database-url
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: teyva-secrets
                  key: anthropic-api-key
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: teyva-secrets
                  key: slack-webhook-url
            - name: ENV
              value: "production"
            - name: DB_SSL
              value: "true"
            - name: ENABLE_RAG
              value: "true"
            - name: LLM_PROVIDER
              value: "anthropic"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: teyva-api-service
  namespace: teyva
spec:
  selector:
    app: teyva
    component: api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
