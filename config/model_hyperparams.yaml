# ============================================================
# TEYVA — Hiperparámetros de modelos
# ============================================================

# ── XGBoost (modelo en producción) ───────────────────────────
xgboost:
  n_estimators: 300
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 3
  gamma: 0.1
  reg_alpha: 0.05       # L1 regularización
  reg_lambda: 1.0       # L2 regularización
  scale_pos_weight: 1   # SMOTE ya balancea — no penalizar adicionalmente
  random_state: 42
  eval_metric: auc
  early_stopping_rounds: 20
  tree_method: hist     # Más rápido en CPU

# ── Random Forest (candidato alternativo) ────────────────────
random_forest:
  n_estimators: 200
  max_depth: 10
  min_samples_split: 5
  min_samples_leaf: 2
  max_features: sqrt
  random_state: 42
  n_jobs: -1

# ── Logistic Regression (baseline) ───────────────────────────
logistic_regression:
  C: 1.0
  penalty: l2
  solver: lbfgs
  max_iter: 1000
  random_state: 42

# ── SMOTE ─────────────────────────────────────────────────────
smote:
  k_neighbors: 5
  random_state: 42
  sampling_strategy: auto

# ── StandardScaler ────────────────────────────────────────────
scaler:
  with_mean: true
  with_std: true

# ── LLM (Claude) ──────────────────────────────────────────────
claude:
  model: "claude-haiku-4-5"
  temperature: 0.3
  max_tokens: 1024
  top_p: 0.95

# ── LLM (Ollama fallback) ─────────────────────────────────────
ollama:
  model: "llama3.2"
  temperature: 0.3
  num_predict: 1024
  top_p: 0.95
  repeat_penalty: 1.1

# ── Embeddings ────────────────────────────────────────────────
sentence_transformers:
  model: "paraphrase-multilingual-MiniLM-L12-v2"
  batch_size: 32
  normalize_embeddings: true
