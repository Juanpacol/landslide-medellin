name: Monitor External API Health

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  check-api-health:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_SYNC: ${{ secrets.DATABASE_URL_SYNC }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PYTHONPATH: ./platform/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd platform/backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API health check
        run: |
          cd platform/backend
          python -m monitoring.api_health

      # Vigilancia de drift INDEPENDIENTE de los crons de ingesta: si todos
      # ellos quedan deshabilitados (GitHub los apaga tras 60 días sin
      # commits), este workflow sigue detectando el drift.
      # continue-on-error: el guard nunca debe marcar en rojo el monitoreo.
      - name: Guard de drift de migraciones
        continue-on-error: true
        run: |
          cd platform/backend
          python -m monitoring.migration_guard

      - name: Notificar fallo a Slack
        if: failure() || cancelled()
        uses: ./.github/actions/notify-failure
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
