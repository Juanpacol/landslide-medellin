name: Predict Risk

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  run-predict-risk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_SYNC: ${{ secrets.DATABASE_URL_SYNC }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      PYTHONPATH: ./platform/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: platform/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Guard de drift + `alembic upgrade head`. Si la BD quedó adelante del
      # repo (migración aplicada sin commitear), omite el upgrade en vez de
      # tumbar la ingesta, y alerta a Slack. Ver docs/RUNBOOK_MIGRATIONS.md.
      - name: Run database migrations
        uses: ./.github/actions/db-migrate

      - name: Run risk prediction
        working-directory: platform/backend
        run: python -m ml.predict

      # continue-on-error: un bug del agente no debe marcar la corrida de
      # predicción como fallida (regla ya aplicada al resto de agentes).
      - name: Run ML drift detection
        working-directory: platform/backend
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m monitoring.ml_drift

      # Un cron rojo no avisa a nadie por sí solo. Esto sí. Solo bash+curl:
      # funciona aunque el paso que falló haya sido `pip install`.
      # cancelled() incluido: un timeout de job no cuenta como failure().
      - name: Notificar fallo a Slack
        if: failure() || cancelled()
        uses: ./.github/actions/notify-failure
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
