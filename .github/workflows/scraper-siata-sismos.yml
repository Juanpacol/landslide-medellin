name: Scraper SIATA Sismos

on:
  schedule:
    - cron: "15,45 * * * *"
  workflow_dispatch:

jobs:
  run-siata-sismos:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_SYNC: ${{ secrets.DATABASE_URL_SYNC }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PYTHONPATH: ./platform/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: platform/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database migrations
        working-directory: platform/backend
        run: |
          alembic upgrade head

      - name: Run SIATA sismos scraper
        working-directory: platform/backend
        run: python -m scraper.siata_sismos

      - name: Validate ingested data
        working-directory: platform/backend
        continue-on-error: true
        run: python -m monitoring.scraper_validator
