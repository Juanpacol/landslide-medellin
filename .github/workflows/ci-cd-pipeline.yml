name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint, type-check & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run linter (ruff)
        run: |
          pip install ruff
          ruff check platform/backend/ src/

      - name: Run type checker (mypy)
        run: |
          pip install mypy
          mypy platform/backend/domain/ platform/backend/application/ --ignore-missing-imports
        continue-on-error: true

      - name: Run unit tests
        env:
          PYTHONPATH: platform/backend
        run: |
          pip install pytest pytest-asyncio
          pytest tests/unit/ -v --tb=short

      - name: Run bias tests
        env:
          PYTHONPATH: platform/backend
        run: |
          pytest tests/bias_tests/ -v --tb=short
        continue-on-error: true  # No bloquear el pipeline si no hay artefactos ML

  build-backend:
    name: Build backend Docker image
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f deployments/docker/Dockerfile.api -t teyva/api:${{ github.sha }} .

      - name: Build inference image
        run: docker build -f deployments/docker/Dockerfile.inference -t teyva/inference:${{ github.sha }} .

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: platform/frontend/pnpm-lock.yaml

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install and build
        working-directory: platform/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
