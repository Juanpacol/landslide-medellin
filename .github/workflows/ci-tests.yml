name: CI — Tests, Lint, Type Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-unit-tests:
    name: Backend Unit Tests & Lint
    runs-on: ubuntu-latest
    # db/session.py exige DATABASE_URL/DATABASE_URL_SYNC al importar (falla
    # con RuntimeError si faltan) — dummies bastan porque tests/unit no abre
    # conexión real, solo necesita que el import no reviente.
    env:
      PYTHONPATH: ./platform/backend
      DATABASE_URL: "postgresql+asyncpg://dummy:dummy@localhost:5432/dummy"
      DATABASE_URL_SYNC: "postgresql://dummy:dummy@localhost:5432/dummy"
      DB_SSL: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd platform/backend
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Bloqueante desde la limpieza de la deuda histórica (130 violaciones →
      # 0). Se mantiene así para que no se vuelva a acumular: el frontend ya
      # era bloqueante y estaba en verde, el backend era la asimetría.
      - name: Lint with ruff
        run: |
          cd platform/backend
          ruff check .

      - name: Format check with ruff
        run: |
          cd platform/backend
          ruff format . --check

      # Coverage gate solo sobre domain/ vía tests/unit: es el único código
      # sin I/O, por eso es el único donde 85% es alcanzable sin tests
      # triviales. tests/integration cubre el resto (scraper/ml/agent/alerts)
      # contra servicios reales, sin gate de cobertura.
      - name: Run unit tests with coverage gate
        run: |
          cd platform/backend
          pytest tests/unit -v --tb=short --cov=domain --cov-report=term-missing

  backend-integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    # Igual que los crons de scrapers ya en producción: no existe DB de
    # staging separada (CLAUDE.md: "UNA sola fuente de verdad"), así que esto
    # corre contra el mismo Supabase vía el connection pooler.
    env:
      PYTHONPATH: ./platform/backend
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_SYNC: ${{ secrets.DATABASE_URL_SYNC }}
      DB_SSL: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd platform/backend
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run integration tests (skip if Ollama absent)
        run: |
          cd platform/backend
          pytest tests/integration -v --tb=short

  # Chequeo estático de la cadena de migraciones. Bloqueante y barato (~20s):
  # no abre conexión a la BD ni necesita secretos.
  #
  # NO se diagnostica contra la BD en PRs a propósito: un PR que agrega una
  # migración legítima aparece como "pending" hasta que se mergea y el cron la
  # aplica — bloquear por eso sería un falso positivo en cada PR de esquema.
  # El diagnóstico contra la BD vive en los crons (ver .github/actions/db-migrate).
  migration-guard:
    name: Alembic — un solo head, cadena íntegra
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONPATH: ./platform/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install alembic
        run: pip install alembic

      - name: Chequeo estático de migraciones
        run: |
          cd platform/backend
          python -m monitoring.migration_guard --offline

  frontend-tests:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22 para igualar la imagen del Dockerfile del frontend.
          node-version: "22"

      # setup-node NO trae pnpm: sin esto todos los pasos de abajo fallan con
      # "pnpm: command not found". Se habilita vía corepack, igual que en el
      # Dockerfile, para respetar el campo packageManager de package.json.
      - name: Habilitar pnpm
        run: corepack enable

      # --ignore-scripts igual que el Dockerfile del frontend: evita compilar
      # sharp (no se usa, images.unoptimized=true) y binarios nativos
      # opcionales. Sin él, pnpm 10+ falla con ERR_PNPM_IGNORED_BUILDS.
      - name: Install dependencies
        run: |
          cd platform/frontend
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Type check
        run: |
          cd platform/frontend
          pnpm typecheck

      - name: Lint
        run: |
          cd platform/frontend
          pnpm lint

      - name: Build
        run: |
          cd platform/frontend
          pnpm build
