name: CI — Tests, Lint, Type Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    # db/session.py exige DATABASE_URL/DATABASE_URL_SYNC al importar (falla
    # con RuntimeError si faltan) — sin esto pytest no colecciona ningún test,
    # ni siquiera los que no tocan BD. No existe DB de staging separada
    # (CLAUDE.md: "UNA sola fuente de verdad"), así que igual que los crons
    # de scrapers ya en producción, esto corre contra el mismo Supabase vía
    # el connection pooler.
    env:
      PYTHONPATH: ./platform/backend
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_SYNC: ${{ secrets.DATABASE_URL_SYNC }}
      DB_SSL: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd platform/backend
          pip install --upgrade pip
          pip install -r requirements.txt

      # No bloqueante: el repo tiene deuda de lint/formato preexistente
      # (139 violaciones, 72 archivos sin formatear). Se reporta en el log
      # para visibilidad; pasa a bloqueante tras una limpieza dedicada.
      - name: Lint with ruff (informativo)
        continue-on-error: true
        run: |
          cd platform/backend
          ruff check .

      - name: Format check with ruff (informativo)
        continue-on-error: true
        run: |
          cd platform/backend
          ruff format . --check

      - name: Run pytest (unit + integration, skip if Ollama absent)
        run: |
          cd platform/backend
          pytest tests/ -v --tb=short

  # Chequeo estático de la cadena de migraciones. Bloqueante y barato (~20s):
  # no abre conexión a la BD ni necesita secretos.
  #
  # NO se diagnostica contra la BD en PRs a propósito: un PR que agrega una
  # migración legítima aparece como "pending" hasta que se mergea y el cron la
  # aplica — bloquear por eso sería un falso positivo en cada PR de esquema.
  # El diagnóstico contra la BD vive en los crons (ver .github/actions/db-migrate).
  migration-guard:
    name: Alembic — un solo head, cadena íntegra
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONPATH: ./platform/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install alembic
        run: pip install alembic

      - name: Chequeo estático de migraciones
        run: |
          cd platform/backend
          python -m monitoring.migration_guard --offline

  frontend-tests:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22 para igualar la imagen del Dockerfile del frontend.
          node-version: "22"

      # setup-node NO trae pnpm: sin esto todos los pasos de abajo fallan con
      # "pnpm: command not found". Se habilita vía corepack, igual que en el
      # Dockerfile, para respetar el campo packageManager de package.json.
      - name: Habilitar pnpm
        run: corepack enable

      - name: Install dependencies
        run: |
          cd platform/frontend
          pnpm install --frozen-lockfile

      - name: Type check
        run: |
          cd platform/frontend
          pnpm typecheck

      - name: Lint
        run: |
          cd platform/frontend
          pnpm lint

      - name: Build
        run: |
          cd platform/frontend
          pnpm build
